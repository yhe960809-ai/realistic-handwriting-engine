name: Bug 报告
description: 提交一个 bug 报告
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交 bug 报告！请尽可能详细地填写以下信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述问题是什么。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题。
      placeholder: |
        1. 使用以下配置...
        2. 渲染文本 '...'
        3. 出现...错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么。

  - type: input
    id: version
    attributes:
      label: 版本
      description: realistic-handwriting-engine 的版本
      placeholder: "0.1.0"

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: "3.12"

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何其他补充信息、截图、日志等。
