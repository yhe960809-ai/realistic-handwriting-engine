name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你的功能建议与什么问题相关？
      description: 清晰简洁地描述问题是什么。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
      description: 清晰简洁地描述你想要发生什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 描述你考虑过的其他替代方案。

  - type: textarea
    id: additional
    attributes:
      label: 其他补充
      description: 其他任何补充说明、截图等。
